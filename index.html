<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Silva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="shortcut icon" href="./assets/image.png" type="image/x-icon">
</head>

<body>
    <canvas id="webgl"></canvas>

    <!-- phones: invisible track that makes the page scrollable (3 figures + the links screen) -->
    <div id="scroll-track" aria-hidden="true">
        <div class="snap"></div><div class="snap"></div><div class="snap"></div><div class="snap"></div>
    </div>

    <!-- phones: last screen of the scroll, square buttons -->
    <section id="links-section" aria-label="Links">
        <h2 class="ls-title">LET'S CONNECT</h2>
        <p class="ls-sub">Find me here or download my CV</p>
        <div class="ls-grid">
            <a class="sq-btn" href="https://github.com/KaonyKampus" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i><span>GitHub</span></a>
            <a class="sq-btn" href="https://www.linkedin.com/in/david-stiven-silva-velandia-ba3529236/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-linkedin-in"></i><span>LinkedIn</span></a>
            <a class="sq-btn" href="https://wa.me/573213101615" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span></a>
            <a class="sq-btn" href="./assets/cv_softare_engineer.pdf" download="CV-David-Silva.pdf"><i class="fa-solid fa-file-arrow-down"></i><span>Download CV</span></a>
            <button type="button" class="sq-btn sq-contact" data-open-contact><i class="fa-solid fa-envelope"></i><span>Contact</span></button>
        </div>
    </section>

    <div id="ui-container">
        <h1 id="main-title">DAVID SILVA</h1>

        <div id="hover-label" class="hidden"></div>

        <div id="modal-overlay" class="hidden">
            <section id="content-panel" class="hud-panel">
                <button id="close-btn" aria-label="Close section">&times;</button>

                <header class="hud-header">
                    <h3 id="hud-title">SECTION</h3>
                    <nav id="hud-tabs-nav" class="hud-tabs"></nav>
                </header>

                <div id="panel-body" class="hud-body"></div>
            </section>
        </div>

        <div id="image-lightbox" class="hidden">
            <button id="lightbox-close-btn" aria-label="Close image">&times;</button>
            <div class="lightbox-content">
                <img id="lightbox-img" src="" alt="Expanded project preview">
                <p id="lightbox-caption"></p>
            </div>
        </div>

        <footer id="main-footer">
            <div class="footer-orbit-container">
                <a href="https://github.com/KaonyKampus" target="_blank" rel="noopener noreferrer" class="social-icon floating-icon"
                    aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="https://www.linkedin.com/in/david-stiven-silva-velandia-ba3529236/" target="_blank" rel="noopener noreferrer"
                    class="social-icon floating-icon" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>

                <h2 class="subtitle-static">SOFTWARE ENGINEER</h2>

                <a href="https://wa.me/573213101615" target="_blank" rel="noopener noreferrer"
                    class="social-icon floating-icon" aria-label="WhatsApp">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                <a href="./assets/cv_softare_engineer.pdf" download="CV-David-Silva.pdf"
                    class="social-icon floating-icon" aria-label="Download CV">
                    <i class="fa-solid fa-file-arrow-down"></i>
                </a>
                <button type="button" id="contact-btn" data-open-contact class="social-icon floating-icon contact-icon" aria-label="Contact me">
                    <i class="fa-solid fa-envelope"></i>
                    <span class="contact-tip">Contact</span>
                </button>
            </div>
            <div id="section-hint" aria-hidden="true">
                <span class="sh-name" id="sh-name">About me</span>
                <span class="sh-tap">Tap the figure to open</span>
                <i class="fa-solid fa-chevron-down sh-arrow"></i>
            </div>
        </footer>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
